services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: vulnlab-juice-shop
    ports:
      - "3000:3000"
    networks:
      - vulnlab
    restart: unless-stopped

  mongo:
    image: mongo:4.4
    container_name: vulnlab-mongo
    networks:
      - vulnlab
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 24

  nodegoat:
    image: nodegoat-web:latest
    container_name: vulnlab-nodegoat
    working_dir: /home/node/app
    command: ["node", "server.js"]
    environment:
      MONGODB_URI: "mongodb://mongo:27017/nodegoat"
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"
    networks:
      - vulnlab
    restart: unless-stopped

  bwapp:
    image: raesene/bwapp:latest
    container_name: vulnlab-bwapp
    ports:
      - "8080:80"
    networks:
      - vulnlab
    restart: unless-stopped

networks:
  vulnlab:
    name: vulnlab
